spring.application.name=quickstop-essentials

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/quickstopdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Create or update database tables from JPA entities
spring.jpa.hibernate.ddl-auto=update

# Run data.sql after Hibernate creates the products table
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false