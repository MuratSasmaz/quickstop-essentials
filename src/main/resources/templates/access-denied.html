<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Access Denied | QuickStop Essentials</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="auth-page d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <section class="auth-card text-center p-4 p-md-5 w-100"
             style="max-width: 720px">

        <div class="error-code"
             aria-hidden="true">
            403
        </div>

        <i class="bi bi-shield-lock-fill display-4 text-primary"></i>

        <h1 class="fw-bold mt-3">
            Access Denied
        </h1>

        <p class="lead text-secondary mx-auto"
           style="max-width: 560px">

            You do not have permission to view this page.
            Please return to a page available for your account role.

        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">

            <a class="btn btn-primary"
               th:href="@{/}">

                <i class="bi bi-house-door me-1"></i>

                Return Home

            </a>

            <a class="btn btn-outline-primary"
               th:href="@{/products}">

                Browse Products

            </a>

        </div>

    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
