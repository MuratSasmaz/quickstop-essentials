<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-lightning-charge-fill me-1"></i>QuickStop Essentials
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNavigation" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/locations}">Pickup Locations</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-light text-primary fw-semibold" th:href="@{/products/new}">
                        <i class="bi bi-plus-circle me-1"></i>Add Product
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer bg-dark text-white mt-auto">
    <div class="container py-4">
        <div class="row align-items-center gy-3">
            <div class="col-md-7">
                <h2 class="h5 mb-1">QuickStop Essentials</h2>
                <p class="text-white-50 mb-0">Everyday essentials, ready when you are.</p>
            </div>
            <div class="col-md-5 text-md-end">
                <a class="footer-link me-3" th:href="@{/products}">Products</a>
                <a class="footer-link me-3" th:href="@{/locations}">Locations</a>
                <a class="footer-link" th:href="@{/about}">About</a>
                <p class="small text-white-50 mt-2 mb-0">&copy; 2026 QuickStop Essentials</p>
            </div>
        </div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
