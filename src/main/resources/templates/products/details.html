<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${product.name + ' | QuickStop Essentials'}">
        Product Details
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container flex-grow-1 py-5">

    <nav aria-label="breadcrumb">

        <ol class="breadcrumb">

            <li class="breadcrumb-item">
                <a th:href="@{/}">
                    Home
                </a>
            </li>

            <li class="breadcrumb-item">
                <a th:href="@{/products}">
                    Products
                </a>
            </li>

            <li class="breadcrumb-item active"
                aria-current="page"
                th:text="${product.name}">
                Product
            </li>

        </ol>

    </nav>

    <article class="details-card mt-4">

        <div class="row g-0">

            <div class="col-lg-6 details-image">

                <img th:if="${product.imageUrl != null
                        and !#strings.isEmpty(product.imageUrl)}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}">

                <div class="product-placeholder h-100"
                     th:unless="${product.imageUrl != null
                        and !#strings.isEmpty(product.imageUrl)}">

                    <i class="bi bi-image"></i>

                </div>

            </div>

            <div class="col-lg-6 p-4 p-xl-5">

                <div class="d-flex flex-wrap gap-2 mb-3">

                    <span class="badge text-bg-primary"
                          th:text="${#strings.replace(
                              product.category.name(),
                              '_',
                              ' '
                          )}">
                        Category
                    </span>

                    <span class="badge text-bg-light border"
                          th:text="${#strings.replace(
                              product.brand.name(),
                              '_',
                              ' '
                          )}">
                        Brand
                    </span>

                </div>

                <h1 class="display-6 fw-bold"
                    th:text="${product.name}">
                    Product Name
                </h1>

                <p class="display-6 text-primary fw-bold my-3"
                   th:text="${#numbers.formatCurrency(product.price)}">
                    $0.00
                </p>

                <p class="lead text-secondary"
                   th:text="${product.description}">
                    Product description
                </p>

                <hr class="my-4">

                <div class="d-flex align-items-center gap-3">

                    <i class="bi bi-box-seam fs-3 text-primary"></i>

                    <div>

                        <span class="small text-secondary d-block">
                            Availability
                        </span>

                        <strong th:classappend="${product.stockQuantity > 0}
                                ? 'text-success'
                                : 'text-danger'"
                                th:text="${product.stockQuantity > 0}
                                ? ${product.stockQuantity + ' units in stock'}
                                : 'Out of stock'">
                            Stock
                        </strong>

                    </div>

                </div>

                <div class="d-flex align-items-center gap-3 mt-3"
                     th:if="${product.createdAt != null}">

                    <i class="bi bi-calendar-check fs-3 text-primary"></i>

                    <div>

                        <span class="small text-secondary d-block">
                            Added
                        </span>

                        <strong th:text="${#temporals.format(
                            product.createdAt,
                            'MMMM d, yyyy'
                        )}">
                            Date
                        </strong>

                    </div>

                </div>

                <div class="d-flex flex-wrap gap-2 mt-4">

                    <a class="btn btn-outline-primary"
                       th:href="@{/products}">

                        <i class="bi bi-arrow-left me-1"></i>

                        Back to Products

                    </a>

                    <!-- STAFF and ADMIN can edit -->
                    <a class="btn btn-primary"
                       th:href="@{/products/{id}/edit(id=${product.id})}"
                       sec:authorize="hasAnyRole('STAFF', 'ADMIN')">

                        <i class="bi bi-pencil-square me-1"></i>

                        Edit

                    </a>

                    <!-- Only ADMIN can delete -->
                    <form th:action="@{/products/{id}/delete(id=${product.id})}"
                          method="post"
                          sec:authorize="hasRole('ADMIN')"
                          onsubmit="return confirm(
                              'Delete this product? This action cannot be undone.'
                          );">

                        <button class="btn btn-danger"
                                type="submit">

                            <i class="bi bi-trash3 me-1"></i>

                            Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </article>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
